
services:
  poll-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: polls_db
      MYSQL_USER: poll_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - poll_mysql_data:/var/lib/mysql

volumes:
  poll_mysql_data:
